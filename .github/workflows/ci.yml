name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # crates/cv3-tod is a workspace member: its C shim needs the distribution's TOD headers,
      # pkg-config and a C compiler. The core and the probe build without them.
      - name: TOD plugin build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfprint-2-tod-dev pkg-config
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      # Builds the cdylib, checks with readelf that every fpi_* import bound the library's default
      # version rather than the legacy thunk, and loads the built object to check the class and the
      # two failed opens under a fake GUsb handle (scripts/check-tod-class.sh).
      - name: TOD plugin build, link and class checks
        run: ./scripts/build-plugin.sh
      - name: Advisories and licences
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses
      - name: Core dependency and unsafe checks
        run: ./scripts/check-core.sh
