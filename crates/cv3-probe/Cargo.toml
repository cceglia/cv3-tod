[package]
name = "cv3-probe"
description = "cvctl: drives the ControlVault 3 sensor directly, one command at a time"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cv3_probe"
path = "src/lib.rs"

[[bin]]
name = "cvctl"
path = "src/main.rs"

[dependencies]
cv3-core = { path = "../cv3-core" }
cv3-wire = { path = "../cv3-wire" }
getrandom = "=0.2.15"
nusb = "=0.2.9"
signal-hook = "=0.4.5"
